<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crack Detector Pro - FFT Analysis</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="dark-mode">
    <div class="app-wrapper">
        <!-- Mobile Header -->
        <header class="mobile-header">
            <button id="menu-toggle" class="icon-btn">
                <i data-lucide="menu"></i>
            </button>
            <span class="mobile-logo">CRACK DETECTOR</span>
            <div style="width: 40px;"></div>
        </header>

        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h1 class="logo">CRACK DETECTOR</h1>
            </div>

            <nav class="sidebar-nav">
                <div class="nav-section">
                    <label for="image-input" class="nav-item btn-accent">
                        <i data-lucide="plus-circle"></i>
                        <span>Add Photos</span>
                    </label>
                    <input id="image-input" type="file" accept="image/*" multiple hidden />

                    <button id="camera-btn" class="nav-item btn-accent">
                        <i data-lucide="camera"></i>
                        <span>Use Camera</span>
                    </button>

                    <button id="process-btn" class="nav-item btn-primary" disabled>
                        <i data-lucide="zap"></i>
                        <span>Process Selected</span>
                    </button>

                    <button id="clear-all-btn" class="nav-item btn-danger" style="margin-top: 10px;">
                        <i data-lucide="trash-2"></i>
                        <span>Clear All Images</span>
                    </button>
                </div>

                <div class="nav-spacer"></div>

                <!-- Gallery Section -->
                <div class="nav-settings">
                    <label>Image Queue</label>
                    <div id="gallery-list" class="gallery-container">
                        <!-- Thumbnails will appear here -->
                    </div>
                </div>

                <div class="nav-settings">
                    <div class="setting-group">
                        <label>Appearance</label>
                        <select id="appearance-select" class="select-menu">
                            <option value="dark">Dark Mode</option>
                            <option value="light">Light Mode</option>
                        </select>
                    </div>
                </div>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div id="camera-container" class="card hidden">
                <div class="camera-wrapper">
                    <video id="video" autoplay playsinline></video>
                    <button id="snap-btn" class="btn btn-primary">
                        <i data-lucide="aperture"></i>
                        Capture & Add
                    </button>
                </div>
                <canvas id="canvas" style="display:none;"></canvas>
            </div>

            <!-- Active Analysis View -->
            <div class="results-grid">
                <div class="card result-card">
                    <div class="card-header"><h3>Original Image</h3></div>
                    <div id="preview-original" class="image-box">
                        <div class="placeholder"><i data-lucide="image"></i></div>
                    </div>
                </div>
                <div class="card result-card">
                    <div class="card-header"><h3>Frequency Spectrum</h3></div>
                    <div id="preview-spectrum" class="image-box">
                        <div class="placeholder"><i data-lucide="activity"></i></div>
                    </div>
                </div>
                <div class="card result-card">
                    <div class="card-header"><h3>High-Pass Filter</h3></div>
                    <div id="preview-filter" class="image-box">
                        <div class="placeholder"><i data-lucide="circle"></i></div>
                    </div>
                </div>
                <div class="card result-card">
                    <div class="card-header"><h3>Detected Features</h3></div>
                    <div id="preview-result" class="image-box">
                        <div class="placeholder"><i data-lucide="scan"></i></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        lucide.createIcons();

        const sidebar = document.getElementById('sidebar');
        const menuToggle = document.getElementById('menu-toggle');
        const imageInput = document.getElementById('image-input');
        const processBtn = document.getElementById('process-btn');
        const cameraBtn = document.getElementById('camera-btn');
        const snapBtn = document.getElementById('snap-btn');
        const video = document.getElementById('video');
        const cameraContainer = document.getElementById('camera-container');
        const appearanceSelect = document.getElementById('appearance-select');
        const galleryList = document.getElementById('gallery-list');
        const clearAllBtn = document.getElementById('clear-all-btn');

        let imageQueue = [];
        let selectedIndex = -1;
        let stream = null;

        // Mobile Menu Toggle
        menuToggle.addEventListener('click', () => {
            sidebar.classList.toggle('active');
            const icon = sidebar.classList.contains('active') ? 'x' : 'menu';
            menuToggle.innerHTML = `<i data-lucide="${icon}"></i>`;
            lucide.createIcons();
        });

        appearanceSelect.addEventListener('change', (e) => {
            document.body.className = e.target.value === 'light' ? 'light-mode' : 'dark-mode';
        });

        // Add to Queue
        function addImageToQueue(blob) {
            const url = URL.createObjectURL(blob);
            imageQueue.push({ blob, previewUrl: url, results: null });
            renderGallery();
            selectImage(imageQueue.length - 1);
        }

        // Render Gallery
        function renderGallery() {
            galleryList.innerHTML = '';
            imageQueue.forEach((item, index) => {
                const thumb = document.createElement('div');
                thumb.className = `gallery-item ${index === selectedIndex ? 'active' : ''}`;
                thumb.innerHTML = `
                    <img src="${item.previewUrl}" onclick="selectImage(${index})">
                    <button class="discard-btn" onclick="discardImage(${index}, event)">
                        <i data-lucide="x"></i>
                    </button>
                `;
                galleryList.appendChild(thumb);
            });
            lucide.createIcons();
            processBtn.disabled = imageQueue.length === 0;
        }

        function selectImage(index) {
            if (index < 0 || index >= imageQueue.length) return;
            selectedIndex = index;
            const item = imageQueue[index];

            if (item.results) {
                document.getElementById('preview-original').innerHTML = `<img src="${item.results.original}">`;
                document.getElementById('preview-spectrum').innerHTML = `<img src="${item.results.spectrum}">`;
                document.getElementById('preview-filter').innerHTML = `<img src="${item.results.filter}">`;
                document.getElementById('preview-result').innerHTML = `<img src="${item.results.result}">`;
            } else {
                document.getElementById('preview-original').innerHTML = `<img src="${item.previewUrl}">`;
                ['spectrum', 'filter', 'result'].forEach(id => {
                    document.getElementById(`preview-${id}`).innerHTML = '<div class="placeholder"><i data-lucide="clock"></i></div>';
                });
                lucide.createIcons();
            }
            renderGallery();
        }

        window.discardImage = function(index, event) {
            event.stopPropagation();
            URL.revokeObjectURL(imageQueue[index].previewUrl);
            imageQueue.splice(index, 1);
            if (selectedIndex >= imageQueue.length) selectedIndex = imageQueue.length - 1;
            if (imageQueue.length === 0) {
                selectedIndex = -1;
                resetView();
            } else {
                selectImage(selectedIndex);
            }
            renderGallery();
        };

        function resetView() {
            ['original', 'spectrum', 'filter', 'result'].forEach(id => {
                document.getElementById(`preview-${id}`).innerHTML = '<div class="placeholder"><i data-lucide="image"></i></div>';
            });
            lucide.createIcons();
        }

        clearAllBtn.addEventListener('click', () => {
            imageQueue.forEach(item => URL.revokeObjectURL(item.previewUrl));
            imageQueue = [];
            selectedIndex = -1;
            resetView();
            renderGallery();
        });

        // Input Handlers
        imageInput.addEventListener('change', (e) => {
            Array.from(e.target.files).forEach(file => addImageToQueue(file));
            if (window.innerWidth <= 900) sidebar.classList.remove('active');
        });

        cameraBtn.addEventListener('click', async () => {
            if (stream) { stopCamera(); return; }
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                video.srcObject = stream;
                cameraContainer.classList.remove('hidden');
                cameraBtn.innerHTML = '<i data-lucide="square"></i><span>Stop Camera</span>';
                lucide.createIcons();
                if (window.innerWidth <= 900) sidebar.classList.remove('active');
            } catch (err) { alert(err); }
        });

        snapBtn.addEventListener('click', () => {
            const canvas = document.getElementById('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            canvas.toBlob(b => addImageToQueue(b));
        });

        function stopCamera() {
            if (stream) {
                stream.getTracks().forEach(t => t.stop());
                stream = null;
                cameraContainer.classList.add('hidden');
                cameraBtn.innerHTML = '<i data-lucide="camera"></i><span>Use Camera</span>';
                lucide.createIcons();
            }
        }

        // Processing
        processBtn.addEventListener('click', async () => {
            if (selectedIndex === -1) return;
            const item = imageQueue[selectedIndex];

            const fd = new FormData();
            fd.append('image', item.blob);

            processBtn.disabled = true;
            processBtn.innerHTML = '<i data-lucide="loader" class="spin"></i><span>Analyzing...</span>';
            lucide.createIcons();

            try {
                const res = await fetch('/process', { method: 'POST', body: fd });
                const data = await res.json();
                if (data.error) throw new Error(data.error);

                item.results = data;
                selectImage(selectedIndex);
            } catch (err) { alert(err.message); }
            finally {
                processBtn.disabled = false;
                processBtn.innerHTML = '<i data-lucide="zap"></i><span>Process Selected</span>';
                lucide.createIcons();
            }
        });
    </script>
</body>
</html>
